services:
  - type: web
    name: sr-construction
    runtime: node
    branch: live
    buildCommand: rm -rf node_modules dist && npm install && npm run build
    startCommand: NODE_ENV=production node dist/boot.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: sr-construction-db
          property: connectionString
      - key: APP_ID
        sync: false
      - key: APP_SECRET
        sync: false
      - key: OWNER_UNION_ID
        sync: false
      - key: KIMI_AGENTGW_API_KEY
        sync: false
      - key: KIMI_AGENTGW_BASE_URL
        sync: false
      - key: KIMI_STORAGE_RESOURCE_ID
        sync: false
      - key: KIMI_AUTH_URL
        value: https://auth.kimi.ai
      - key: KIMI_OPEN_URL
        value: https://open.kimi.com

databases:
  - name: sr-construction-db
    databaseName: sr_construction
    user: sr_construction
    plan: free
