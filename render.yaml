services:
  - type: web
    name: sr-construction-live
    runtime: node
    branch: main
    buildCommand: npm install --include=dev && npm run build
    startCommand: NODE_ENV=production node dist/boot.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sr-construction-db-v5
          property: connectionString
      - key: APP_ID
        sync: false
      - key: APP_SECRET
        sync: false
      - key: OWNER_UNION_ID
        sync: false
      - key: KIMI_AGENTGW_API_KEY
        sync: false
      - key: KIMI_AGENTGW_BASE_URL
        sync: false
      - key: KIMI_STORAGE_RESOURCE_ID
        sync: false
      - key: KIMI_AUTH_URL
        value: https://auth.kimi.ai
      - key: KIMI_OPEN_URL
        value: https://open.kimi.com

databases:
  - name: sr-construction-db-v5
    databaseName: sr_construction_v5
    user: sr_construction
    plan: free
